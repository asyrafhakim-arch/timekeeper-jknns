<style>

/* =========================================================
   GLOBAL VARIABLES
========================================================= */

:root {

    --header-color: #111827;

    --background-color: #0f172a;

    --panel-color: #1e293b;

    --timer-color: #020617;

    --button-color: #2563eb;

    --button-hover: #1d4ed8;

    --text-color: #ffffff;

    --secondary-text: #cbd5e1;

    --status-color: #22c55e;

    --accent-color: #38bdf8;

}


/* =========================================================
   RESET
========================================================= */

* {

    box-sizing: border-box;

    margin: 0;

    padding: 0;

}


html {

    scroll-behavior: smooth;

}


body {

    min-height: 100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        var(--background-color);

    color:
        var(--text-color);

    overflow-x: hidden;

}


/* =========================================================
   HEADER
========================================================= */

header {

    min-height: 190px;

    padding:
        25px 35px;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        var(--header-color);

    border-bottom:
        3px solid var(--accent-color);

    position: relative;

}


.header-content {

    width: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 25px;

    text-align: center;

}


.logo {

    width: 160px;

    height: 160px;

    object-fit: contain;

    display: none;

    flex-shrink: 0;

    border-radius: 14px;

}


.header-text {

    display: flex;

    flex-direction: column;

    justify-content: center;

}


.header-title {

    font-size:

    font-weight: 900;

    line-height: 1.1;

    letter-spacing: 1px;

}


.header-subtitle {

    margin-top: 10px;

    color:
        var(--secondary-text);

    font-size:
        clamp(16px, 2vw, 25px);

}


/* =========================================================
   MAIN
========================================================= */

main {

    width: 100%;

    max-width: 1250px;

    margin: 0 auto;

    padding:
        30px 20px 50px;

}


/* =========================================================
   TIMER PANEL
========================================================= */

.timer-panel {

    background:
        var(--panel-color);

    border-radius: 22px;

    padding: 30px;

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.35);

}


/* =========================================================
   SPEAKER
========================================================= */

.speaker-area {

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 10px;

    margin-bottom: 25px;

}


.speaker-label {

    font-size: 14px;

    color:
        var(--secondary-text);

    text-transform: uppercase;

    letter-spacing: 2px;

    font-weight: bold;

}


#speakerName {

    width: min(750px, 100%);

    padding: 15px;

    border-radius: 12px;

    border:
        2px solid #334155;

    outline: none;

    background:
        var(--timer-color);

    color:
        var(--text-color);

    text-align: center;

    font-size: 22px;

}


#speakerName:focus {

    border-color:
        var(--accent-color);

}


/* =========================================================
   TIMER BOX
========================================================= */

.timer-box {

    background:
        var(--timer-color);

    border:
        5px solid var(--status-color);

    border-radius: 25px;

    padding:
        clamp(35px, 7vw, 75px) 20px;

    text-align: center;

    margin-bottom: 25px;

    transition:
        .3s ease;

}


#timer {

    font-size:
        clamp(70px, 15vw, 185px);

    font-weight: 900;

    line-height: 1;

    letter-spacing: 5px;

}


#timerStatus {

    font-weight: bold;

}


/* =========================================================
   PRESETS
========================================================= */

.presets {

    display: grid;

    grid-template-columns:
        repeat(6, 1fr);

    gap: 10px;

    margin-bottom: 20px;

}


.preset-btn {

    border: none;

    border-radius: 10px;

    padding: 14px 8px;

    background:
        var(--button-color);

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition: .2s;

}


.preset-btn:hover {

    background:
        var(--button-hover);

    transform:
        translateY(-2px);

}


/* =========================================================
   MAIN CONTROLS
========================================================= */

.controls {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 12px;

}


.controls button {

    border: none;

    border-radius: 12px;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

    transition: .2s;

}


.controls button:hover {

    transform:
        translateY(-2px);

}


.start-btn {

.pause-btn {

.reset-btn {

}

    gap: 15px;

.info-card {

.info-label {

.info-value {

}


/* =========================================================

.settings-button {

.settings-overlay {

.settings-overlay.active {

.settings-panel {

.color-grid {

.audio-buttons {

.audio-buttons button {

}


.test-bell {

.remove-bell {

    background:

.official-bell {

/* =========================================================

========================================================= */

.settings-actions {

.settings-actions button {

.save-settings {

    background:

}


.reset-settings {

    background:

/* =========================================================
   FOOTER
========================================================= */

footer {

    }


    .color-grid {

        grid-template-columns:

    }


    .settings-actions {

        grid-template-columns:
            1fr;

    }

}

</style>

/* =========================================================

========================================================= */

const DEFAULT_SETTINGS = {

    title:

    subtitle:
        "Presentation Timer",

    logo:
        "",

    logoSize:
        160,

    header:
        "#111827",

    background:
        "#0f172a",

    panel:
        "#1e293b",

    timer:
        "#020617",

    button:
        "#2563eb",

    status:
        "#22c55e",

    text:
        "#ffffff"

};


/* =========================================================
   OFFICIAL BELL
========================================================= */

const OFFICIAL_BELL_PATH =
    "assets/school-bell.mp3";


/* =========================================================
   TIMER VARIABLES
========================================================= */

let totalSeconds =
    600;


let remainingSeconds =
    600;


let timerInterval =
    null;


let isRunning =
    false;


let warning5Triggered =
    false;


let warning1Triggered =
    false;


let timeUpTriggered =
    false;


/* =========================================================
   USER BELL
========================================================= */

let userBellData =
    null;


let userBellName =
    "";


/* =========================================================
   CURRENT BELL MODE
========================================================= */

let bellMode =
    "official";


/*
   official
   user
*/


/* =========================================================
   LOAD ALL
========================================================= */

function initializeSystem() {

    loadSettings();

    loadUserBell();

    updateDisplay();

    updateColor();

}


/* =========================================================
   LOAD SETTINGS
========================================================= */

function loadSettings() {

    let settings =
        DEFAULT_SETTINGS;


    const saved =
        localStorage.getItem(
            "timekeeperJKNNSSettings"
        );


    if (saved) {

        try {

            settings = {

                ...DEFAULT_SETTINGS,

                ...JSON.parse(saved)

            };

        }

        catch (error) {

            console.log(
                "Settings tidak sah."
            );

        }

    }


    applySettings(
        settings
    );

}


/* =========================================================
   APPLY SETTINGS
========================================================= */

function applySettings(settings) {

    const root =
        document.documentElement;


    root.style.setProperty(
        "--header-color",
        settings.header
    );


    root.style.setProperty(
        "--background-color",
        settings.background
    );


    root.style.setProperty(
        "--panel-color",
        settings.panel
    );


    root.style.setProperty(
        "--timer-color",
        settings.timer
    );


    root.style.setProperty(
        "--button-color",
        settings.button
    );


    root.style.setProperty(
        "--button-hover",
        settings.button
    );


    root.style.setProperty(
        "--status-color",
        settings.status
    );


    root.style.setProperty(
        "--text-color",
        settings.text
    );


    document.getElementById(
        "headerTitle"
    ).textContent =
        settings.title;


    document.getElementById(

function handleBellUpload(event) {

    const file =
        event.target.files[0];


    if (!file) {

        return;

    }


    if (
        !file.type.startsWith(
            "audio/"
        )
    ) {

        alert(
            "Sila pilih fail audio."
        );

        event.target.value =
            "";

        return;

    }


    /*
       Had 15 MB
    */

    if (
        file.size >
        15 * 1024 * 1024
    ) {

        alert(
            "Saiz audio melebihi 15MB."
        );

        event.target.value =
            "";

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(e) {

            const data =
                e.target.result;


            try {

                localStorage.setItem(
                    "timekeeperJKNNSUserBell",
                    data
                );


                localStorage.setItem(
                    "timekeeperJKNNSUserBellName",
                    file.name
                );


                localStorage.setItem(
                    "timekeeperJKNNSBellMode",
                    "user"
                );


            }

            catch(error) {

                alert(
                    "Fail audio terlalu besar untuk disimpan dalam browser. " +
                    "Sila gunakan fail yang lebih kecil."
                );

                return;

            }


            userBellData =
                data;


            userBellName =
                file.name;


            bellMode =
                "user";


            updateBellDisplay();


            alert(
                "User Bell berjaya digunakan."
            );

        };


    reader.readAsDataURL(
        file
    );

}

/* =========================================================
   ORIGINAL SYNTHESIZED FALLBACK
========================================================= */

function originalBellSound() {

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;


    if (!AudioContext) {

        return;

    }


    const ctx =
        new AudioContext();


    const now =
        ctx.currentTime;


    const frequencies = [
        900,
        1200,
        1500
    ];


    frequencies.forEach(
        function(freq, index) {

            const oscillator =
                ctx.createOscillator();


            const gain =
                ctx.createGain();


            oscillator.type =
                "sine";


            oscillator.frequency.setValueAtTime(
                freq,
                now
            );


            gain.gain.setValueAtTime(
                0,
                now
            );


            gain.gain.linearRampToValueAtTime(
                0.8 / (index + 1),
                now + 0.02
            );


            gain.gain.exponentialRampToValueAtTime(
                0.001,
                now + 1.5
            );


            oscillator.connect(
                gain
            );


            gain.connect(
                ctx.destination
            );


            oscillator.start(
                now
            );


            oscillator.stop(
                now + 1.6
            );

        }
    );


    setTimeout(
        function() {

            ctx.close();

        },
        2000
    );

}


/* =========================================================
   PRESETS
========================================================= */

function setPreset(minutes) {

    pauseTimer();


    totalSeconds =
        minutes * 60;


    remainingSeconds =

        false;

    timeUpTriggered =

    );


    updateDisplay();

    updateColor();

/* =========================================================
   START
========================================================= */

function startTimer() {

    if (isRunning) {

        return;

    }


    if (
        remainingSeconds <= 0
    ) {

        return;

    }


    isRunning =
        true;


    updateStatus(
        "BERJALAN"
    );


    timerInterval =
        setInterval(
            timerTick,
            1000
        );

}


/* =========================================================
   PAUSE
========================================================= */

function pauseTimer() {

    isRunning =
        false;


    clearInterval(
        timerInterval
    );


    timerInterval =
        null;


    if (
        remainingSeconds > 0
    ) {

        updateStatus(
            "JEDA"
        );

    }

}


/* =========================================================
   RESET
========================================================= */

function resetTimer() {

    pauseTimer();


    remainingSeconds =
        totalSeconds;


    warning5Triggered =
        false;


    warning1Triggered =
        false;


    timeUpTriggered =
        false;


    updateStatus(
        "SIAP"
    );


    updateDisplay();

    updateColor();

}


/* =========================================================
   TIMER TICK
========================================================= */

function timerTick() {

    if (
        remainingSeconds > 0
    ) {

        remainingSeconds--;

    }


    updateDisplay();

    updateColor();


    /*
       5 MINUTES
    */

    if (
        remainingSeconds === 300 &&
        !warning5Triggered
    ) {

        warning5Triggered =
            true;


        bell5Minutes();


        updateStatus(
            "5 MINIT BERBAKI"
        );

    }


    /*
       1 MINUTE
    */

    if (
        remainingSeconds === 60 &&
        !warning1Triggered
    ) {

        warning1Triggered =
            true;


        bell1Minute();


        updateStatus(
            "1 MINIT BERBAKI"
        );

    }


    /*
       TIME UP
    */

    if (
        remainingSeconds === 0 &&
        !timeUpTriggered
    ) {

        timeUpTriggered =
            true;


        pauseTimer();


        bellTimeUp();


        updateStatus(
            "MASA TAMAT"
        );

    }

}


/* =========================================================
   DISPLAY
========================================================= */

function updateDisplay() {

    const minutes =
        Math.floor(
            remainingSeconds / 60
        );


    const seconds =
        remainingSeconds % 60;


    const formatted =
        String(minutes)
            .padStart(2, "0")
        +
        ":"
        +
        String(seconds)
            .padStart(2, "0");


    document.getElementById(
        "timer"
    ).textContent =
        formatted;


    document.getElementById(
        "remainingTime"
    ).textContent =
        formatted;


    const originalMinutes =
        Math.floor(
            totalSeconds / 60
        );


    const originalSeconds =
        totalSeconds % 60;


    const originalFormatted =
        String(originalMinutes)
            .padStart(2, "0")
        +
        ":"
        +
        String(originalSeconds)
            .padStart(2, "0");


    document.getElementById(
        "originalTime"
    ).textContent =
        originalFormatted;

}

   STATUS
========================================================= */

function updateStatus(status) {

        "timerStatus"
    ).textContent =
        status;


    document.getElementById(
        "sessionStatus"
    ).textContent =
        status;

}


/* =========================================================
   TIMER COLOR
========================================================= */

function updateColor() {

    const timerBox =
        document.getElementById(
            "timerBox"
        );


    if (
        remainingSeconds <= 60 &&
        remainingSeconds > 0
    ) {

        timerBox.style.borderColor =
            "#ef4444";


        timerBox.style.boxShadow =
            "0 0 40px rgba(239,68,68,.5)";

    }

    else if (
        remainingSeconds <= 300 &&
        remainingSeconds > 60
    ) {

        timerBox.style.borderColor =
            "#f59e0b";


        timerBox.style.boxShadow =
            "0 0 30px rgba(245,158,11,.4)";

    }

    else if (
        remainingSeconds === 0
    ) {

        timerBox.style.borderColor =
            "#dc2626";


        timerBox.style.boxShadow =
            "0 0 50px rgba(220,38,38,.6)";

    }

    else {

        timerBox.style.borderColor =
            "var(--status-color)";


        timerBox.style.boxShadow =
            "none";

    }

}


/* =========================================================
   ADJUST TIME
========================================================= */

function adjustTime(seconds) {

    remainingSeconds +=
        seconds;


    if (
        remainingSeconds < 0
    ) {

        remainingSeconds =
            0;

    }


    totalSeconds =
        remainingSeconds;


    warning5Triggered =
        remainingSeconds < 300;


    warning1Triggered =
        remainingSeconds < 60;


    timeUpTriggered =
        remainingSeconds === 0;


    updateDisplay();

    updateColor();

}

/* =========================================================
   KEYBOARD SHORTCUT
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        const active =
            document.activeElement;


        /*
           SPACE
        */

        if (
            event.code === "Space"
        ) {

            if (
                active &&
                (
                    active.tagName ===
                    "INPUT" ||
                    active.tagName ===
                    "TEXTAREA"
                )
            ) {

                return;

            }


            event.preventDefault();


            if (isRunning) {

                pauseTimer();

            }

            else {

                startTimer();

            }

        }


        /*
           R
        */

        if (
            event.key.toLowerCase() ===
            "r"
        ) {

            resetTimer();

        }


        /*
           B
        */

        if (
            event.key.toLowerCase() ===
            "b"
        ) {

            ringBell();

        }


        /*
           F
        */

        if (
            event.key.toLowerCase() ===
            "f"
        ) {

            toggleFullscreen();

        }


        /*
           ESC
        */

        if (
            event.key === "Escape"
        ) {

            closeSettings();

        }

    }
);
